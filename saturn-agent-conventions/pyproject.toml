[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saturn-agent-conventions"
version = "0.0.1"
description = "Offline tree-sitter extractor for Saturn pipeline conventions"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-scala>=0.23",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
saturn-conventions = "saturn_conventions.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/saturn_conventions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tree_sitter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_scala"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
